<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MF-Log Test</title>
<meta name="robots" content="noindex">
<style>body{margin:0;font-family:system-ui,sans-serif;background:#F6F5F0;color:#1E2A22;padding:32px 20px;line-height:1.5}a{color:#2F6B3F;font-weight:700}</style>
</head>
<body>
<p>Der Testkanal liegt jetzt unter <a href="/mf-test/">…/mf-test/</a>.</p>
<script>
// Bis Version 1.0.1 lag der Testkanal unter /mf-log/test/, im Geltungsbereich der echten App (/mf-log/).
// Seit 1.0.2 liegt er in einem eigenen Repo unter /mf-test/. Alte Registrierung entfernen, dann weiter.
(async () => {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r => new URL(r.scope).pathname === location.pathname.replace(/[^/]*$/, '')).map(r => r.unregister()));
    }
    if ('caches' in window) await Promise.all(['mflog-app-1.0.0', 'mflog-test-1.0.0', 'mflog-test-1.0.1'].map(k => caches.delete(k)));
  } catch (e) {}
  location.replace('/mf-test/' + location.search + location.hash);
})();
</script>
</body>
</html>
